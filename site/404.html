    .lost { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 96px 16px 32px; box-sizing: border-box; }
    .lost-card { position: relative; width: min(460px, 100%); box-sizing: border-box; padding: 2rem 1.6rem 1.8rem; border-radius: 22px; background: var(--card); border: 1px solid var(--line); text-align: center; box-shadow: 0 10px 28px rgb(46 36 24 / .08); }
    .lost-bear { position: absolute; left: 50%; bottom: calc(100% - 10px); width: 128px; transform: translateX(-50%); z-index: -1; }
    .lost-bear svg { display: block; width: 100%; height: auto; }
    .lost-card h1 { font-family: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif; font-weight: 600; font-size: clamp(1.6rem, 6vw, 2.1rem); line-height: 1.15; margin: 0; }
    .lost-card p { margin: .8rem 0 0; color: var(--ink-2); }
    .lost-card .lost-code { font-weight: 700; font-size: .82rem; letter-spacing: .09em; text-transform: uppercase; color: var(--teal); margin: 0 0 .5rem; }
    .lost-home { display: inline-block; margin-top: 1.4rem; padding: .75rem 1.3rem; border-radius: 999px; background: var(--primary); color: var(--primary-ink); font-weight: 700; text-decoration: none; }
    .lost-home:hover { text-decoration: underline; }
    .lost-home:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  </style>
