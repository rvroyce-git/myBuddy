<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyBuddy · your calm AI news buddy</title>
  <meta name="description" content="MyBuddy reads the news on seven topics every morning, writes short AI summaries with source links, and sends them to Telegram.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F6F1E8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1B19" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://rvroyce-git.github.io/myBuddy/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MyBuddy">
  <meta property="og:title" content="MyBuddy · your calm AI news buddy">
  <meta property="og:description" content="Seven topics. Short AI summaries. Sent to Telegram.">
  <meta property="og:url" content="https://rvroyce-git.github.io/myBuddy/">
  <meta name="twitter:card" content="summary">
  <!-- Saved theme before first paint, so there's no flash. -->
  <script>try{var t=localStorage.getItem("mybuddy-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}document.documentElement.classList.add("js")</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='24' cy='26' r='16' fill='%23F4E1C6' stroke='%23D9B88F' stroke-width='3'/%3E%3Ccircle cx='76' cy='26' r='16' fill='%23F4E1C6' stroke='%23D9B88F' stroke-width='3'/%3E%3Ccircle cx='50' cy='56' r='38' fill='%23F4E1C6' stroke='%23D9B88F' stroke-width='3'/%3E%3Cellipse cx='50' cy='68' rx='16' ry='12' fill='%23FFF8EE'/%3E%3Ccircle cx='36' cy='50' r='4.5' fill='%234A3A30'/%3E%3Ccircle cx='64' cy='50' r='4.5' fill='%234A3A30'/%3E%3Cellipse cx='50' cy='63' rx='6' ry='4.5' fill='%234A3A30'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#news">Skip to today's news</a>

  <div class="sky" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
  </div>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#top" aria-label="MyBuddy, back to top">
        <svg class="brand-face" viewBox="0 0 120 92" aria-hidden="true">
          <circle cx="24" cy="26" r="17" class="fur"/><circle cx="24" cy="26" r="9" class="inner"/>
          <circle cx="96" cy="26" r="17" class="fur"/><circle cx="96" cy="26" r="9" class="inner"/>
          <ellipse cx="60" cy="60" rx="44" ry="40" class="fur"/>
          <ellipse cx="60" cy="72" rx="19" ry="14" class="muzzle"/>
          <circle cx="44" cy="54" r="5" class="eye"/><circle cx="76" cy="54" r="5" class="eye"/>
          <ellipse cx="60" cy="66" rx="6.5" ry="4.8" class="nose"/>
        </svg>
        <span class="brand-name">MyBuddy</span>
      </a>
      <div class="top-actions">
        <button class="icon-btn theme-btn" type="button" id="themeBtn" aria-label="Switch colour theme" title="Switch colour theme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
        <a class="icon-btn" href="https://github.com/rvroyce-git/myBuddy" target="_blank" rel="noopener noreferrer" aria-label="MyBuddy on GitHub (opens in a new tab)" title="GitHub">
          <svg class="i-gh" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main id="top">
    <!-- 1. Hero -->
    <section class="hero wrap" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="updated" id="updated" hidden><span class="pulse" aria-hidden="true"></span><span id="updatedText"></span></p>
        <h1 id="hero-title" class="words">
          <span style="--i:0">Your</span> <span style="--i:1">morning</span> <span style="--i:2">news,</span> <span class="soft" style="--i:3">made</span> <span class="soft" style="--i:4">calm.</span>
        </h1>
        <p class="sub">Seven topics. Short AI summaries. Sent to Telegram.</p>
        <a class="btn" href="#news"><span>Today's news</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></a>
      </div>
      <div class="hero-art" data-loop>
        <div class="halo" aria-hidden="true"></div>
        <div class="hero-bear" role="img" aria-label="A friendly teddy bear waving hello while holding a newspaper">
          <svg viewBox="0 0 240 262" aria-hidden="true">
            <g class="wave-arm">
              <ellipse cx="192" cy="118" rx="19" ry="36" transform="rotate(28 192 118)" class="fur"/>
              <circle cx="208" cy="86" r="19" class="fur"/>
              <ellipse cx="208" cy="88" rx="10" ry="8" class="inner"/>
            </g>
            <ellipse cx="78" cy="244" rx="30" ry="17" class="fur"/>
            <ellipse cx="162" cy="244" rx="30" ry="17" class="fur"/>
            <ellipse cx="78" cy="245" rx="15" ry="9" class="inner"/>
            <ellipse cx="162" cy="245" rx="15" ry="9" class="inner"/>
            <ellipse cx="120" cy="190" rx="72" ry="62" class="fur"/>
            <ellipse cx="120" cy="202" rx="44" ry="38" class="muzzle"/>
            <g transform="rotate(-9 74 178)">
              <rect x="34" y="150" width="78" height="58" rx="8" class="paper"/>
              <line x1="46" y1="166" x2="88" y2="166" class="paper-line t"/>
              <line x1="46" y1="180" x2="100" y2="180" class="paper-line"/>
              <line x1="46" y1="192" x2="94" y2="192" class="paper-line"/>
            </g>
            <ellipse cx="66" cy="196" rx="21" ry="16" class="fur"/>
            <ellipse cx="64" cy="198" rx="10" ry="7" class="inner"/>
            <circle cx="66" cy="46" r="25" class="fur"/><circle cx="66" cy="46" r="13" class="inner"/>
            <circle cx="174" cy="46" r="25" class="fur"/><circle cx="174" cy="46" r="13" class="inner"/>
            <ellipse cx="120" cy="94" rx="66" ry="58" class="fur"/>
            <ellipse cx="120" cy="114" rx="28" ry="21" class="muzzle"/>
            <ellipse cx="80" cy="108" rx="10" ry="6.5" class="cheek"/>
            <ellipse cx="160" cy="108" rx="10" ry="6.5" class="cheek"/>
            <g class="eyes">
              <circle cx="96" cy="88" r="7.5" class="eye"/><circle cx="144" cy="88" r="7.5" class="eye"/>
              <circle cx="98.5" cy="85.5" r="2.5" class="shine"/><circle cx="146.5" cy="85.5" r="2.5" class="shine"/>
            </g>
            <ellipse cx="120" cy="105" rx="9.5" ry="7" class="nose"/>
            <path d="M120 112v6M109 120c5 5 17 5 22 0" class="mouth"/>
          </svg>
        </div>
        <p class="hello" aria-hidden="true">Hi there!</p>
      </div>
    </section>

    <!-- 2. Today's news -->
    <section class="news wrap" id="news" aria-labelledby="news-title">
      <h2 id="news-title" class="section-title">Today's news</h2>
      <p class="sr-only" id="srStatus" role="status"></p>
      <noscript><p class="note">Turn on JavaScript to see today's news.</p></noscript>
      <ul class="grid" id="grid" aria-labelledby="news-title"></ul>
    </section>

    <!-- 3. How it works -->
    <section class="how wrap" id="how" aria-labelledby="how-title">
      <h2 id="how-title" class="section-title">How it works</h2>
      <ol class="flow" id="flow" data-loop>
        <li class="step acc-teal" style="--k:0">
          <span class="step-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 19a1 1 0 1 0 0-.01M5 12a7 7 0 0 1 7 7M5 5a14 14 0 0 1 14 14"/></svg></span>
          <span class="step-name">Collect</span>
        </li>
        <li class="step acc-lav" style="--k:1">
          <span class="step-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg></span>
          <span class="step-name">Summarise</span>
        </li>
        <li class="step acc-blue" style="--k:2">
          <span class="step-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 4L3 11l6 2.5M21 4l-3 16-9-6.5M21 4L9 13.5V19l3-3.5"/></svg></span>
          <span class="step-name">Telegram</span>
        </li>
        <li class="step acc-sage" style="--k:3">
          <span class="step-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg></span>
          <span class="step-name">Web</span>
        </li>
        <li class="track" aria-hidden="true"><span class="track-line"></span><span class="runner"><span class="runner-dot"></span></span></li>
      </ol>
    </section>
  </main>

  <!-- 4. Footer -->
  <footer class="footer wrap">
    <p>© 2026 MyBuddy · <a href="https://github.com/rvroyce-git/myBuddy" target="_blank" rel="noopener noreferrer">GitHub<span class="sr-only"> (opens in a new tab)</span></a></p>
  </footer>

  <!-- Report popup: native modal dialog (Esc, backdrop and the close button close it). -->
  <dialog class="dlg" id="dlg" aria-labelledby="dlgTopic" aria-describedby="dlgHeadline">
    <div class="dlg-panel">
      <div class="dlg-head">
        <span class="emoji" id="dlgEmoji" aria-hidden="true"></span>
        <div class="dlg-id">
          <h2 id="dlgTopic"></h2>
          <p class="dlg-time" id="dlgTime"></p>
        </div>
        <button class="dlg-close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="dlg-body">
        <p class="dlg-headline" id="dlgHeadline"></p>
        <p class="dlg-summary" id="dlgSummary"></p>
        <ul class="items" id="dlgItems"></ul>
      </div>
    </div>
  </dialog>

  <!-- Bear artwork cloned by app.js: the head peeks behind a card, the paws hold its edge. -->
  <template id="peekBear">
    <div class="peek-back" aria-hidden="true">
      <svg viewBox="0 0 120 92" class="peek-head">
        <circle cx="24" cy="26" r="17" class="fur"/><circle cx="24" cy="26" r="9" class="inner"/>
        <circle cx="96" cy="26" r="17" class="fur"/><circle cx="96" cy="26" r="9" class="inner"/>
        <ellipse cx="60" cy="60" rx="44" ry="40" class="fur"/>
        <ellipse cx="60" cy="72" rx="19" ry="14" class="muzzle"/>
        <ellipse cx="34" cy="66" rx="7" ry="4.5" class="cheek"/>
        <ellipse cx="86" cy="66" rx="7" ry="4.5" class="cheek"/>
        <g class="eyes">
          <circle cx="44" cy="54" r="5" class="eye"/><circle cx="76" cy="54" r="5" class="eye"/>
          <circle cx="45.6" cy="52.4" r="1.7" class="shine"/><circle cx="77.6" cy="52.4" r="1.7" class="shine"/>
        </g>
        <ellipse cx="60" cy="66" rx="6.5" ry="4.8" class="nose"/>
        <path d="M60 70.5v4.5M52.5 76c3.5 3 11.5 3 15 0" class="mouth"/>
      </svg>
      <p class="peek-bubble"></p>
    </div>
    <div class="peek-front" aria-hidden="true">
      <svg viewBox="0 0 40 30" class="paw paw-l"><ellipse cx="20" cy="16" rx="17" ry="12" class="fur"/><path d="M12 20v5M20 21v5M28 20v5" class="toe"/></svg>
      <svg viewBox="0 0 40 30" class="paw paw-r"><ellipse cx="20" cy="16" rx="17" ry="12" class="fur"/><path d="M12 20v5M20 21v5M28 20v5" class="toe"/></svg>
    </div>
    <svg viewBox="0 0 64 52" class="sleepy" aria-hidden="true">
      <circle cx="14" cy="16" r="10" class="fur"/><circle cx="50" cy="16" r="10" class="fur"/>
      <ellipse cx="32" cy="32" rx="24" ry="19" class="fur"/>
      <ellipse cx="32" cy="38" rx="10" ry="7.5" class="muzzle"/>
      <path d="M21 29q3 3 6 0M37 29q3 3 6 0" class="mouth thin"/>
      <ellipse cx="32" cy="35.5" rx="3.6" ry="2.6" class="nose"/>
      <path class="zz z1" d="M54 4h6l-6 6h6"/><path class="zz z2" d="M58 -6h4l-4 4h4"/>
    </svg>
  </template>

  <script src="assets/app.js" defer></script>
</body>
</html>
