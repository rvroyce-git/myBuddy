name: Publish website
# Builds the site from main (site/) plus the latest reports from the `data` branch and pushes
# it to the gh-pages branch, which GitHub Pages serves (Settings → Pages → Deploy from a
# branch → gh-pages / root). New reports are published by the workflow on the `data` branch.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml", ".github/scripts/build-pages.sh"]
  workflow_dispatch:

permissions:
  contents: write

# Reports can arrive minutes apart; let a running publish finish, then publish the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Fetch the latest reports from the data branch
        run: |
          git fetch --depth 1 origin data || true
          git show origin/data:reports.json > "$RUNNER_TEMP/reports.json" 2>/dev/null || : > "$RUNNER_TEMP/reports.json"
      - name: Publish site/ + reports to gh-pages
        run: bash .github/scripts/build-pages.sh site "$RUNNER_TEMP/reports.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
