name: Publish website
# Copies site/ to the gh-pages branch; GitHub Pages serves that branch (Settings → Pages →
# Deploy from a branch → gh-pages / root). Push a change to this file to publish it again.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Reports can arrive minutes apart; let a running publish finish, then publish the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Push site/ to the gh-pages branch
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          cp -R site/. "$out/"
          touch "$out/.nojekyll"   # serve files as they are (no Jekyll processing)
          cd "$out"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish website from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
