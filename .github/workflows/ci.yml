name: CI

on:
  push:
    # The server pushes fresh reports several times a day; those don't need a test run.
    paths-ignore: ["site/data/**"]
  pull_request:

permissions:
  contents: read

# Every action is pinned to a full commit SHA (the comment names the release); Dependabot
# keeps them current. Python packages come from the hash-pinned lock files in requirements/.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps -e .
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        # Browser tests run in the `ui` job (they need Chromium).
        run: pytest --ignore=tests/ui --cov=mybuddy --cov-report=term-missing

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps -e .
          python -m playwright install --with-deps chromium
      - name: Browser tests
        run: pytest tests/ui

  lint-js:
    # ESLint for the website's JavaScript (site/). Dev-only npm tooling from the committed
    # package-lock.json; the site itself has no build step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # current Node LTS
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: ESLint
        run: npx --no-install eslint .

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: scan every commit, not just the tip
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan full git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml \
            --exit-code 1 .
