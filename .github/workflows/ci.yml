name: CI

on:
  push:
    # The server pushes fresh reports several times a day; those don't need a test run.
    paths-ignore: ["site/data/**"]
  pull_request:

permissions:
  contents: read

# Every action is pinned to a full commit SHA (the comment names the release); Dependabot
# keeps them current. Python packages come from the hash-pinned lock files in requirements/.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps -e .
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        # Browser tests run in the `ui` job (they need Chromium).
        run: pytest --ignore=tests/ui --cov=mybuddy --cov-report=term-missing

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps -e .
          python -m playwright install --with-deps chromium
      - name: Browser tests
        run: pytest tests/ui

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history: scan every commit, not just the tip
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan full git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml \
            --exit-code 1 .
